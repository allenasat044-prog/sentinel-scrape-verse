<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sentinel — Scraper Health Monitor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root {
    --bg: #0a0e16;
    --surface: #12161f;
    --surface-2: #181d29;
    --border: #232a38;
    --text: #e7ebf3;
    --muted: #7c869a;
    --ok: #3ddc97;
    --warn: #f5a623;
    --bad: #ff5c72;
    --accent: #6f8cff;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      radial-gradient(circle at 15% 0%, rgba(111,140,255,0.07), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(61,220,151,0.05), transparent 40%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: var(--font-body);
    padding: 40px 44px 64px;
    min-height: 100vh;
  }

  /* subtle woven thread motif */
  .thread-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.35;
    background-image:
      repeating-linear-gradient(115deg, rgba(111,140,255,0.035) 0px, rgba(111,140,255,0.035) 1px, transparent 1px, transparent 120px),
      repeating-linear-gradient(25deg, rgba(111,140,255,0.03) 0px, rgba(111,140,255,0.03) 1px, transparent 1px, transparent 160px);
    z-index: 0;
  }

  .page { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; }

  header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 6px; }
  .live-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 0 0 rgba(61,220,151,0.6);
    animation: pulse 2.2s ease-out infinite;
    flex-shrink: 0;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(61,220,151,0.55); }
    70%  { box-shadow: 0 0 0 9px rgba(61,220,151,0); }
    100% { box-shadow: 0 0 0 0 rgba(61,220,151,0); }
  }
  h1 {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .sub { color: var(--muted); margin: 6px 0 34px; font-size: 14px; }
  .sub code { font-family: var(--font-mono); background: var(--surface-2); padding: 2px 6px; border-radius: 4px; font-size: 12.5px; }

  .top {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 14px;
    margin-bottom: 40px;
  }
  .stat {
    background: linear-gradient(180deg, var(--surface), var(--surface-2));
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 20px 18px;
    position: relative;
    overflow: hidden;
  }
  .stat::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
    opacity: 0.6;
  }
  .stat .label {
    font-family: var(--font-mono);
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .stat .value {
    font-family: var(--font-display);
    font-size: 32px;
    font-weight: 700;
    margin-top: 8px;
    font-variant-numeric: tabular-nums;
  }
  .value.ok { color: var(--ok); }
  .value.warn { color: var(--warn); }
  .value.bad { color: var(--bad); }

  h2 {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  h2::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .timeline { display: flex; flex-direction: column; gap: 9px; }
  .event {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 10px;
    padding: 13px 18px;
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: baseline;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .event:hover { transform: translateX(2px); border-color: var(--accent); }
  .event.fail { border-left-color: var(--bad); }
  .event.heal { border-left-color: var(--warn); }
  .event.verify-ok { border-left-color: var(--ok); }
  .event .kind {
    font-family: var(--font-display);
    font-weight: 600;
    text-transform: capitalize;
    font-size: 14.5px;
  }
  .event .time {
    font-family: var(--font-mono);
    color: var(--muted);
    font-size: 11.5px;
    white-space: nowrap;
  }
  .event .detail {
    font-family: var(--font-mono);
    color: var(--muted);
    font-size: 12.5px;
    margin-top: 5px;
    flex-basis: 100%;
    line-height: 1.5;
  }
  .empty {
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 30px;
    text-align: center;
    border: 1px dashed var(--border);
    border-radius: 14px;
  }
  .empty code { color: var(--accent); }
</style>
</head>
<body>
  <div class="thread-bg"></div>
  <div class="page">
    <header>
      <span class="live-dot"></span>
      <h1>Sentinel</h1>
    </header>
    <div class="sub">
      <span class="eyebrow">Self-healing scraper monitor</span> — reads <code>healing_log.json</code>
    </div>

    <div class="top" id="stats"></div>

    <h2>Healing Timeline</h2>
    <div class="timeline" id="timeline"></div>
  </div>

<script>
async function load() {
  let events = [];
  try {
    const res = await fetch('healing_log.json', { cache: 'no-store' });
    events = await res.json();
  } catch (e) {
    document.getElementById('timeline').innerHTML =
      '<div class="empty">No healing_log.json found yet. Run sentinel.py first, ' +
      'then serve this folder (e.g. <code>python -m http.server</code>) so the browser can fetch it.</div>';
    return;
  }

  const runs = events.filter(e => e.kind === 'run');
  const heals = events.filter(e => e.kind === 'heal');
  const healthEvents = events.filter(e => e.kind === 'run' || e.kind === 'verify');
  const lastHealthEvent = healthEvents[healthEvents.length - 1];
  const health = lastHealthEvent ? Math.round((lastHealthEvent.detail.healthy_fraction || 0) * 100) : null;

  const statsEl = document.getElementById('stats');
  statsEl.innerHTML = `
    <div class="stat">
      <div class="label">Current Health</div>
      <div class="value ${health === null ? '' : health >= 85 ? 'ok' : health >= 50 ? 'warn' : 'bad'}">
        ${health === null ? '—' : health + '%'}
      </div>
    </div>
    <div class="stat">
      <div class="label">Total Runs</div>
      <div class="value">${runs.length}</div>
    </div>
    <div class="stat">
      <div class="label">Heal Attempts</div>
      <div class="value">${heals.length}</div>
    </div>
    <div class="stat">
      <div class="label">Last Record Count</div>
      <div class="value">${lastHealthEvent ? lastHealthEvent.detail.total_records : '—'}</div>
    </div>
  `;

  const timelineEl = document.getElementById('timeline');
  if (events.length === 0) {
    timelineEl.innerHTML = '<div class="empty">No events yet.</div>';
    return;
  }
  timelineEl.innerHTML = [...events].reverse().map(e => {
    let cls = '';
    if (!e.success) cls = 'fail';
    else if (e.kind === 'heal') cls = 'heal';
    else if (e.kind === 'verify' && e.success) cls = 'verify-ok';

    let detailText = '';
    if (e.kind === 'run' || e.kind === 'verify') {
      detailText = `health ${Math.round((e.detail.healthy_fraction || 0) * 100)}% · ` +
        `${e.detail.total_records ?? '?'} records` +
        (e.detail.broken_fields && e.detail.broken_fields.length
          ? ` · broken: ${e.detail.broken_fields.join(', ')}` : '');
    } else if (e.kind === 'diagnose') {
      detailText = e.detail.prompt;
    } else if (e.detail.error) {
      detailText = e.detail.error;
    }

    return `<div class="event ${cls}">
      <div>
        <div class="kind">${e.kind}${e.success ? '' : ' (failed)'}</div>
        <div class="detail">${detailText || ''}</div>
      </div>
      <div class="time">${new Date(e.timestamp).toLocaleString()}</div>
    </div>`;
  }).join('');
}
load();
setInterval(load, 3000);
</script>
</body>
</html>
